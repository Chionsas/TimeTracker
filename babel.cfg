# Map short name to import path (needed when setuptools entry points are not visible to Babel).
[extractors]
jinja2 = jinja2.ext:babel_extract
# Not Babel's own JavaScript extractor: that one loses calls inside template
# literals and everything after some regexes (see scripts/babel_javascript.py).
# It lives in this repository, so run pybabel with PYTHONPATH=. from its root.
javascript = scripts.babel_javascript:extract

[python: app/**.py]
[python: *.py]
[jinja2: app/templates/**.html]
encoding = utf-8
# gettext()/ngettext() calls in JavaScript (see app/static/i18n.js). Bundles and
# third-party code are build outputs, not sources; the ignores must come first.
[ignore: app/static/dist/**]
[ignore: app/static/vendor/**]
[javascript: app/static/**.js]
